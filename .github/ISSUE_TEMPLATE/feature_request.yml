name: Feature request
description: Suggest a change or addition. Open this before writing any code.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are reviewed, not automatically accepted. Describe the problem first, then the proposed change.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today, or what is hard, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen? Include item ids, commands or config keys if you know them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: I understand that contributions are by invitation, under the PolyForm Strict licence.
          required: true
