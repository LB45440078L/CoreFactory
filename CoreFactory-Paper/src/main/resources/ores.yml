# =====================================================================================================
#  CoreFactory ores
#
#  Ores are laid on top of the vanilla terrain. Every chunk is filled from the world seed and the chunk's
#  coordinates, so the same seed always gives the same veins (non-random, but not the same as vanilla's own ore).
#  Veins replace only the blocks in "replace". The vanilla block an ore occupies is "host": it is a block the
#  plugin places and keeps track of, so mining it gives the custom drop and nothing else.
#
#  A chunk gets its deposits as it generates, or the first time it loads if it was generated before the deposits came in.
#  A marker in the chunk keeps later loads from laying them again.
#
#    host              vanilla block the ore is placed as
#    drop              component id from materials.yml given when the ore is mined
#    drop-amount       [min, max] items per block
#    replace           blocks the vein may replace
#    min-y, max-y      vertical range
#    volume            litres of petroleum one block holds, for a fluid deposit; 0 or no key for a count ore
#    weight            chance a new deposit holds this ore, relative to the other solid ores (default 2)
# =====================================================================================================

ores:

  uraninite_ore:
    name: "&8Uraninite Ore"
    host: BLACK_GLAZED_TERRACOTTA
    drop: raw_uraninite
    drop-amount: [2, 4]
    replace: [STONE, DEEPSLATE, TUFF, ANDESITE, GRANITE, DIORITE]
    min-y: -48
    max-y: 24

  pitchblende_ore:
    name: "&6Pitchblende Ore"
    host: BROWN_GLAZED_TERRACOTTA
    drop: raw_pitchblende
    drop-amount: [1, 3]
    replace: [STONE, DEEPSLATE, GRANITE]
    min-y: -64
    max-y: -8

  monazite_ore:
    name: "&eMonazite Ore"
    host: YELLOW_GLAZED_TERRACOTTA
    drop: raw_monazite
    drop-amount: [2, 4]
    replace: [STONE, GRANITE, DIORITE, ANDESITE, TUFF]
    min-y: 0
    max-y: 80

  thorite_ore:
    name: "&8Thorite Ore"
    host: GRAY_GLAZED_TERRACOTTA
    drop: raw_thorite
    drop-amount: [1, 3]
    replace: [DEEPSLATE, STONE, TUFF]
    min-y: -64
    max-y: -16

  galena_ore:
    name: "&7Galena Ore"
    host: LIGHT_GRAY_GLAZED_TERRACOTTA
    drop: raw_galena
    drop-amount: [2, 5]
    replace: [STONE, ANDESITE, DIORITE, DEEPSLATE]
    min-y: -32
    max-y: 40

  cinnabar_ore:
    name: "&cCinnabar Ore"
    host: RED_GLAZED_TERRACOTTA
    drop: raw_cinnabar
    drop-amount: [2, 4]
    replace: [STONE, DEEPSLATE, ANDESITE]
    min-y: -32
    max-y: 24

  fluorite_ore:
    name: "&dFluorite Ore"
    host: PURPLE_GLAZED_TERRACOTTA
    drop: raw_fluorite
    drop-amount: [3, 6]
    replace: [STONE, DEEPSLATE, TUFF, GRANITE]
    min-y: -48
    max-y: 64

  crude_petroleum_deposit:
    name: "&8Crude Petroleum Deposit"
    host: WHITE_GLAZED_TERRACOTTA
    # No drop: a petroleum drill pumps this deposit as litres of petroleum fluid into the oil network, not as items.
    replace: [STONE, DEEPSLATE]
    min-y: -64
    max-y: 0
    volume: 400

  # Count ores below: ore drills mine them, so they need no drill of their own. Added after the deposit so the
  # registry indices of the ores above do not move.

  saltpeter_deposit:
    name: "&fSaltpeter Deposit"
    host: LIME_GLAZED_TERRACOTTA
    drop: raw_saltpeter
    drop-amount: [2, 4]
    replace: [SAND, SANDSTONE, RED_SANDSTONE, TERRACOTTA, STONE]
    min-y: -32
    max-y: 80

  sulfur_deposit:
    name: "&eSulfur Deposit"
    host: ORANGE_GLAZED_TERRACOTTA
    drop: raw_sulfur
    drop-amount: [2, 4]
    replace: [STONE, DEEPSLATE, TUFF, ANDESITE, DIORITE]
    min-y: -48
    max-y: 32

  zinc_deposit:
    name: "&7Sphalerite (Zinc Ore)"
    host: CYAN_GLAZED_TERRACOTTA
    drop: raw_sphalerite
    drop-amount: [2, 4]
    replace: [STONE, DEEPSLATE, GRANITE, DIORITE, ANDESITE]
    min-y: -48
    max-y: 48

  # Coal: an ore drill mines one charcoal per coal block (drop-amount is fixed at one). Appended last so the
  # registry indices of the ores above do not move.
  coal_ore:
    name: "&8Coal Ore"
    host: COAL_ORE
    drop: charcoal
    drop-amount: [1, 1]
    replace: [STONE, DEEPSLATE, ANDESITE, GRANITE, DIORITE, TUFF]
    min-y: -64
    max-y: 96

  # Common metals: iron and copper are the most common solid deposits, gold is less so and diamond is the rarest. The
  # weights are relative (see weight above). Each ore is laid into stone at its own depth, and a drill mines it like the
  # other ores. The hosts are glazed terracotta, so the ore blocks do not recolour the vanilla ores of the terrain.
  iron_ore:
    name: "&fIron Ore"
    host: BLUE_GLAZED_TERRACOTTA
    drop: raw_iron
    drop-amount: [2, 4]
    replace: [STONE, DEEPSLATE, TUFF, ANDESITE, GRANITE, DIORITE]
    min-y: -32
    max-y: 80
    weight: 6

  copper_ore:
    name: "&6Copper Ore"
    host: GREEN_GLAZED_TERRACOTTA
    drop: raw_copper
    drop-amount: [2, 4]
    replace: [STONE, DEEPSLATE, TUFF, ANDESITE, DIORITE]
    min-y: -16
    max-y: 112
    weight: 6

  gold_ore:
    name: "&eGold Ore"
    host: PINK_GLAZED_TERRACOTTA
    drop: raw_gold
    drop-amount: [1, 3]
    replace: [STONE, DEEPSLATE, GRANITE, DIORITE]
    min-y: -64
    max-y: 32
    weight: 3

  # Diamond: an ore drill yields one diamond per unit, as coal yields charcoal. Deep only.
  diamond_ore:
    name: "&bDiamond Ore"
    host: LIGHT_BLUE_GLAZED_TERRACOTTA
    drop: diamond
    drop-amount: [1, 1]
    replace: [STONE, DEEPSLATE, TUFF]
    min-y: -64
    max-y: -16
    weight: 1
