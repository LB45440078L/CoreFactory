# =====================================================================================================
#  CoreFactory crafting components
#
#  Components are custom items that are not TNT but are needed to craft the stronger TNT types.
#  Each one has its own id and optional recipe. Its look is generated by the resource pack art (docs/TEXTURES.md).
#
#  Recipe ingredients:
#    material:<NAME>   a vanilla item, e.g. material:IRON_INGOT (a bare name also works)
#    item:<id>         another component from this file
#    tnt:<id>          a TNT type from tnts.yml
#
#  Shaped recipes: "pattern" is up to three rows of three characters (a space is empty), and each
#  character in the pattern maps to an ingredient under "ingredients".
#  Shapeless recipes: "ingredients" is a list of up to nine items, in any arrangement.
#
# =====================================================================================================

components:

  fuse_linker:
    name: "&bFuse Linker"
    lore:
      - "&7Right-click a placed TNT, then another,"
      - "&7to link them with a visible fuse."
      - "&8Sneak-right-click a TNT to clear its links."
    material: REDSTONE
    recipe:
      type: shapeless
      ingredients: [material:REDSTONE, material:REDSTONE, material:IRON_INGOT]

  fuse_wire:
    name: "&cFuse Wire"
    lore:
      - "&7Fine conductive wire, drawn for the linked fuses."
    material: COPPER_INGOT
    recipe:
      type: shapeless
      ingredients: [material:COPPER_INGOT, material:COPPER_INGOT, material:COPPER_INGOT, material:REDSTONE]

  shaped_charge_lens:
    name: "&6Shaped Charge Lens"
    lore:
      - "&7Focuses a blast into a narrow cone."
    material: GLASS
    recipe:
      type: shaped
      pattern: ["GIG", "IDI", "GIG"]
      ingredients:
        G: material:GLASS
        I: material:IRON_INGOT
        D: material:DIAMOND

  gravity_core:
    name: "&5Gravity Core"
    lore:
      - "&7A dense lattice that bends space around it."
      - "&8Handle with care."
    material: OBSIDIAN
    recipe:
      type: shaped
      pattern: ["OEO", "ENE", "OEO"]
      ingredients:
        O: material:OBSIDIAN
        E: material:ENDER_PEARL
        N: material:NETHER_STAR

  vitrifier_flux:
    name: "&fVitrifier Flux"
    lore:
      - "&7Lowers the melting point of anything it touches."
    material: SAND
    recipe:
      type: shapeless
      ingredients: [material:SAND, material:SAND, material:SAND, material:SAND, material:GLOWSTONE_DUST, material:BLAZE_POWDER]

  sorting_magnet:
    name: "&9Sorting Magnet"
    lore:
      - "&7Pulls chosen ores toward the nearest chest."
    material: LODESTONE
    recipe:
      type: shapeless
      ingredients: [material:IRON_INGOT, material:IRON_INGOT, material:REDSTONE, material:LODESTONE]

  anchor_crystal:
    name: "&bAnchor Crystal"
    lore:
      - "&7Projects a field no explosion may enter."
    material: AMETHYST_SHARD
    recipe:
      type: shaped
      pattern: [" A ", "AEA", " A "]
      ingredients:
        A: material:AMETHYST_SHARD
        E: material:END_CRYSTAL

  pulse_capacitor:
    name: "&4Pulse Capacitor"
    lore:
      - "&7Stores enough charge to send one clean pulse."
    material: REDSTONE_BLOCK
    recipe:
      type: shaped
      pattern: ["RRR", "CCC", "RRR"]
      ingredients:
        R: material:REDSTONE
        C: material:COPPER_INGOT

  quantum_detonator:
    name: "&eQuantum Detonator"
    lore:
      - "&7Watches for a body moving close by."
    material: CLOCK
    recipe:
      type: shaped
      pattern: ["RDR", "DGD", "RDR"]
      ingredients:
        R: material:REDSTONE
        D: material:DIAMOND
        G: material:GOLD_INGOT

  biohazard_culture:
    name: "&aBiohazard Culture"
    lore:
      - "&7Sealed, living and very unfriendly."
    material: SLIME_BALL
    recipe:
      type: shapeless
      ingredients: [material:ROTTEN_FLESH, material:ROTTEN_FLESH, material:SPIDER_EYE, material:FERMENTED_SPIDER_EYE, material:SLIME_BALL]

  napalm_gel:
    name: "&6Napalm Gel"
    lore:
      - "&7Sticky, burning, and it sticks to everything."
    material: HONEY_BOTTLE
    recipe:
      type: shapeless
      ingredients: [material:MAGMA_CREAM, material:COAL, material:COAL, material:GUNPOWDER, material:SLIME_BALL]

  anchor_plate:
    name: "&7Anchor Plate"
    lore:
      - "&7A reinforcing plate for the nuclear casing."
    material: IRON_BLOCK
    recipe:
      type: shaped
      pattern: ["III", "IGI", "III"]
      ingredients:
        I: material:IRON_INGOT
        G: material:GOLD_INGOT

  enriched_uranium:
    name: "&aEnriched Uranium"
    lore:
      - "&7U-235 metal from an enrichment cascade. Weapons-grade stock."
      - "&8Made only by process, never by hand."
    material: NETHERITE_SCRAP

  plutonium_pit:
    name: "&dPlutonium Pit"
    lore:
      - "&7The hollow sphere at the heart of a bomb."
      - "&8Pressed from bred plutonium oxide. It is warm to the touch."
    material: NETHER_STAR
    recipe:
      type: shapeless
      ingredients: [item:plutonium_oxide, item:plutonium_oxide, item:plutonium_oxide, item:plutonium_oxide,
                    material:NETHER_STAR, material:GOLD_BLOCK]

  tritium_booster:
    name: "&3Tritium Booster"
    lore:
      - "&7Fuses light atoms under extreme pressure."
    material: PRISMARINE_CRYSTALS
    recipe:
      type: shaped
      pattern: ["DBD", "BNB", "DBD"]
      ingredients:
        D: item:deuterium_cell
        B: material:BLAZE_POWDER
        N: material:NETHER_STAR

  neutron_initiator:
    name: "&eNeutron Initiator"
    lore:
      - "&7Fires the first neutrons into the core."
    material: AMETHYST_CLUSTER
    recipe:
      type: shapeless
      ingredients: [material:AMETHYST_BLOCK, material:GUNPOWDER, material:GUNPOWDER, material:REDSTONE_BLOCK]

  nuclear_casing:
    name: "&cNuclear Casing"
    lore:
      - "&7Tamper-proof casing for a warhead."
    material: IRON_BLOCK
    recipe:
      type: shaped
      pattern: ["IGI", "GDG", "IGI"]
      ingredients:
        I: material:IRON_BLOCK
        G: material:GOLD_BLOCK
        D: material:DIAMOND_BLOCK

  thermonuclear_core:
    name: "&4Thermonuclear Core"
    lore:
      - "&7A staged fusion secondary. It is very heavy."
      - "&8Crafting it is the hardest recipe on this server."
    material: TRIDENT
    recipe:
      type: shaped
      pattern: ["PBP", "BNB", "PBP"]
      ingredients:
        P: item:plutonium_pit
        B: item:tritium_booster
        N: item:neutron_initiator

  # ----------------------------------------------------------------- Radiation protection and detection

  hazmat_fabric:
    name: "&eHazmat Fabric"
    lore:
      - "&7Sealed, dense cloth that keeps dust out of the lungs."
      - "&8Two leather and two lead make one sheet."
    material: YELLOW_WOOL
    recipe:
      type: shapeless
      ingredients: [material:LEATHER, material:LEATHER, material:LEAD, material:LEAD]

  radioactive_helmet:
    name: "&eRadioactive Helmet"
    lore:
      - "&7Sealed visor and filter, part of the Radioactive Suit."
      - "&8Wear all four pieces to be shielded from fallout."
    material: LEATHER_HELMET
    recipe:
      type: shaped
      pattern: ["FFF", "F F"]
      ingredients:
        F: item:hazmat_fabric

  radioactive_chestplate:
    name: "&eRadioactive Chestplate"
    lore:
      - "&7Sealed torso layer, part of the Radioactive Suit."
      - "&8Wear all four pieces to be shielded from fallout."
    material: LEATHER_CHESTPLATE
    recipe:
      type: shaped
      pattern: ["F F", "FFF", "FFF"]
      ingredients:
        F: item:hazmat_fabric

  radioactive_leggings:
    name: "&eRadioactive Leggings"
    lore:
      - "&7Sealed leg layers, part of the Radioactive Suit."
      - "&8Wear all four pieces to be shielded from fallout."
    material: LEATHER_LEGGINGS
    recipe:
      type: shaped
      pattern: ["FFF", "F F", "F F"]
      ingredients:
        F: item:hazmat_fabric

  radioactive_boots:
    name: "&eRadioactive Boots"
    lore:
      - "&7Sealed boots, part of the Radioactive Suit."
      - "&8Wear all four pieces to be shielded from fallout."
    material: LEATHER_BOOTS
    recipe:
      type: shaped
      pattern: ["F F", "F F"]
      ingredients:
        F: item:hazmat_fabric

  geiger_counter:
    name: "&eGeiger Counter"
    lore:
      - "&7Hold it to read the radiation where you stand."
      - "&8The reading shows on the action bar."
    material: CLOCK
    recipe:
      type: shaped
      pattern: ["IRI", "FCF", "IRI"]
      ingredients:
        I: material:IRON_INGOT
        R: material:REDSTONE
        F: item:hazmat_fabric
        C: material:COMPASS

  # ----------------------------------------------------------------- Coal products

  # Coal from a coal vein: drills and breaks both yield charcoal. Coal is the drop of coal_ore in ores.yml.
  charcoal:
    name: "&7Charcoal"
    lore:
      - "&7Burnt wood. Fuel for the charcoal generator and the kiln."
    material: CHARCOAL

  # ----------------------------------------------------------------- Turret parts (hand-made)

  iron_plate:
    name: "&7Iron Plate"
    lore:
      - "&7Sheet iron, pressed flat. Frames and mechanisms use it."
    material: SHIELD
    recipe:
      type: shapeless
      ingredients: [material:IRON_INGOT, material:IRON_INGOT]

  iron_gear:
    name: "&7Iron Gear"
    lore:
      - "&7A ring of teeth that turns a mechanism."
    material: SMITHING_TABLE
    recipe:
      type: shaped
      pattern: [" I ", "I I", " I "]
      ingredients:
        I: material:IRON_INGOT

  circuit_board:
    name: "&bCircuit Board"
    lore:
      - "&7Copper traces and redstone, laid out for a control unit."
    material: REPEATER
    recipe:
      type: shaped
      pattern: ["RCR", "CRC", "RCR"]
      ingredients:
        R: material:REDSTONE
        C: material:COPPER_INGOT
