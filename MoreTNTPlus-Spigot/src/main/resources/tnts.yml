# =====================================================================================================
#  MoreTNT+ TNT types
#
#  Every entry is one TNT. The keys:
#    name           display name (ampersand colour codes)
#    lore           lines shown on the item
#    material       base item material (TNT for every type, so placed blocks behave like TNT)
#    fuse-ticks     fuse length once lit (20 ticks = 1 second)
#    radius         blast radius in blocks. Its meaning depends on the mechanic (see docs/MECHANICS.md)
#    mechanic       the behaviour; one of the ids listed in docs/MECHANICS.md
#    effects        optional modifiers: shockwave_ring, debris, echo, silent
#    settings       mechanic-specific numbers. Remove any key to use its default.
#    recipe         shaped or shapeless; ingredients are material:, item: (see items.yml) or tnt:
#    texture        read by the resource pack builder only (see docs/RESOURCE_PACK.md)
#
#  Recipes use items.yml components where the TNT is meant to be hard to make.
# =====================================================================================================

tnts:

  # ----------------------------------------------------------------- Structural / physics

  chain_reaction_tnt:
    name: "&6Chain Reaction TNT"
    lore:
      - "&7Lights every TNT nearby, one step at a time."
      - "&8Builds a rolling wave, not a single frame."
    material: TNT
    fuse-ticks: 60
    radius: 6
    mechanic: chain_reaction
    effects: []
    settings:
      delay-per-block: 3
      chain-radius: 10
      damage: 10
    recipe:
      type: shaped
      pattern: ["RRR", "RTR", "RRR"]
      ingredients: {R: "material:REDSTONE", T: "material:TNT"}
    texture: {base: "#B5362A", accent: "#FFB347", pattern: stripes}

  shaped_charge_tnt:
    name: "&eShaped Charge TNT"
    lore:
      - "&7Blasts a narrow cone along the direction"
      - "&7it was placed facing. Mines and breaches."
      - "&8Aim with /mtnt aim."
    material: TNT
    fuse-ticks: 40
    radius: 14
    mechanic: shaped_charge
    effects: []
    settings:
      length: 14
      cone-degrees: 25
      damage: 14
      default-direction: [1, 0, 0]
    recipe:
      type: shaped
      pattern: ["LIL", "ITI", "LIL"]
      ingredients: {L: "item:shaped_charge_lens", I: "material:IRON_INGOT", T: "material:TNT"}
    texture: {base: "#C9A227", accent: "#3A3010", pattern: rings}

  gravity_well_tnt:
    name: "&5Gravity Well TNT"
    lore:
      - "&7Sucks blocks and creatures inward first,"
      - "&7then carves a smaller crater at the centre."
    material: TNT
    fuse-ticks: 80
    radius: 8
    mechanic: gravity_well
    effects: []
    settings:
      pull-ticks: 40
      pull-strength: 0.45
      max-debris: 300
      crater-fraction: 0.5
      damage: 6
    recipe:
      type: shaped
      pattern: ["OGO", "GTG", "OGO"]
      ingredients: {O: "material:OBSIDIAN", G: "item:gravity_core", T: "material:TNT"}
    texture: {base: "#2A1442", accent: "#B57BFF", pattern: rings}

  implosion_tnt:
    name: "&8Implosion TNT"
    lore:
      - "&7The inverse of an explosion: everything"
      - "&7collapses into one dense core at the centre."
    material: TNT
    fuse-ticks: 60
    radius: 8
    mechanic: implosion
    effects: []
    settings:
      core-radius: 2
      core-material: BLACK_CONCRETE
      pull-strength: 1.2
      damage: 4
    recipe:
      type: shaped
      pattern: ["DDD", "DTD", "DDD"]
      ingredients: {D: "material:DIAMOND_BLOCK", T: "material:TNT"}
    texture: {base: "#1A1A1E", accent: "#5C5C66", pattern: checker}

  fuse_linked_tnt:
    name: "&cFuse-Linked TNT"
    lore:
      - "&7Does not explode on its own. Link it to other"
      - "&7TNT with a Fuse Linker; ignite it to relay."
    material: TNT
    fuse-ticks: 20
    radius: 3
    mechanic: fuse_linked
    effects: []
    settings:
      link-delay: 4
    recipe:
      type: shaped
      pattern: ["WRW", "RTR", "WRW"]
      ingredients: {W: "item:fuse_wire", R: "material:REDSTONE", T: "material:TNT"}
    texture: {base: "#8C1D1D", accent: "#FF5555", pattern: circuit}

  delayed_cascade_tnt:
    name: "&7Cluster Cascade TNT"
    lore:
      - "&7Several waves of small submunitions,"
      - "&7spaced by ticks, scattered around the target."
    material: TNT
    fuse-ticks: 60
    radius: 10
    mechanic: delayed_cascade
    effects: []
    settings:
      waves: 3
      wave-interval: 6
      submunitions: 6
      spread: 10
      submunition-radius: 3.5
      damage: 6
    recipe:
      type: shaped
      pattern: ["SGS", "GTG", "SGS"]
      ingredients: {S: "material:SAND", G: "material:GUNPOWDER", T: "material:TNT"}
    texture: {base: "#4A4F55", accent: "#D0D6DC", pattern: dots}

  four_dimensional_tnt:
    name: "&d4-Dimensional TNT"
    lore:
      - "&7Carves 3D slices of a four-dimensional sphere."
      - "&8Unpredictable. Dangerous. Do not test indoors."
    material: TNT
    fuse-ticks: 60
    radius: 10
    mechanic: four_dimensional
    effects: []
    settings:
      steps: 14
      step-ticks: 2
      thickness: 1.4
      damage: 10
    recipe:
      type: shaped
      pattern: ["GNG", "NTN", "GNG"]
      ingredients: {G: "material:AMETHYST_SHARD", N: "item:neutron_initiator", T: "material:TNT"}
    texture: {base: "#2A0A3A", accent: "#E070FF", pattern: glyph}

  # ----------------------------------------------------------------- Terrain morphing

  vitrify_tnt:
    name: "&fVitrify TNT"
    lore:
      - "&7Fuses a sphere of blocks into glass, with an"
      - "&7obsidian core. Nothing is destroyed or dropped."
    material: TNT
    fuse-ticks: 60
    radius: 7
    mechanic: vitrify
    effects: []
    settings:
      outer-material: GLASS
      inner-material: OBSIDIAN
      inner-fraction: 0.45
      damage: 3
    recipe:
      type: shaped
      pattern: ["FSF", "STS", "FSF"]
      ingredients: {F: "item:vitrifier_flux", S: "material:GLASS", T: "material:TNT"}
    texture: {base: "#A8E8F0", accent: "#2A1A40", pattern: dots}

  liquefy_tnt:
    name: "&9Liquefy TNT"
    lore:
      - "&7Turns solid ground in the blast into lava."
      - "&7Change the fluid in tnts.yml for water or slime."
    material: TNT
    fuse-ticks: 60
    radius: 6
    mechanic: liquefy
    effects: []
    settings:
      fluid: LAVA
      damage: 4
    recipe:
      type: shaped
      pattern: ["WLW", "LTL", "WLW"]
      ingredients: {W: "material:WATER_BUCKET", L: "material:LAVA_BUCKET", T: "material:TNT"}
    texture: {base: "#5A1A00", accent: "#FF8A1A", pattern: flame}

  terraform_tnt:
    name: "&aTerraform TNT"
    lore:
      - "&7Reverse excavation: the crater is refilled"
      - "&7up to the old ground level, with dirt."
    material: TNT
    fuse-ticks: 60
    radius: 7
    mechanic: terraform
    effects: []
    settings:
      fill-material: DIRT
      damage: 6
    recipe:
      type: shaped
      pattern: ["DGD", "GTG", "DGD"]
      ingredients: {D: "material:DIRT", G: "material:GRAVEL", T: "material:TNT"}
    texture: {base: "#6B4A2A", accent: "#3E7A2A", pattern: stripes}

  randomize_tnt:
    name: "&dRandomize TNT"
    lore:
      - "&7Swaps every block in the blast for a random"
      - "&7one from a weighted pool. Chaos for minigames."
    material: TNT
    fuse-ticks: 60
    radius: 6
    mechanic: randomize
    effects: []
    settings:
      pool:
        - {material: STONE, weight: 6}
        - {material: DEEPSLATE, weight: 2}
        - {material: ANDESITE, weight: 3}
        - {material: GRAVEL, weight: 2}
        - {material: MOSSY_COBBLESTONE, weight: 1}
      damage: 5
    recipe:
      type: shaped
      pattern: ["CRC", "RTR", "CRC"]
      ingredients: {C: "material:COBBLESTONE", R: "material:REDSTONE", T: "material:TNT"}
    texture: {base: "#505050", accent: "#E040E0", pattern: checker}

  sculpt_tnt:
    name: "&bSculpt TNT"
    lore:
      - "&7Removes only a thin shell along a chosen"
      - "&7sphere, cylinder or torus. Precise demolition."
    material: TNT
    fuse-ticks: 60
    radius: 10
    mechanic: sculpt
    effects: []
    settings:
      shape: sphere
      thickness: 1.5
      height: 6
      tube-radius: 3
      damage: 4
    recipe:
      type: shaped
      pattern: ["BIB", "ITI", "BIB"]
      ingredients: {B: "material:IRON_BLOCK", I: "material:IRON_INGOT", T: "material:TNT"}
    texture: {base: "#2A6E8A", accent: "#A8E0FF", pattern: rings}

  # ----------------------------------------------------------------- Entity / status

  concussion_tnt:
    name: "&eConcussion TNT"
    lore:
      - "&7No block damage and no deaths. Slows,"
      - "&7nauseates and blinds everything in range."
    material: TNT
    fuse-ticks: 40
    radius: 12
    mechanic: concussion
    effects: []
    settings:
      slowness-seconds: 8
      nausea-seconds: 12
      blindness-seconds: 5
    recipe:
      type: shaped
      pattern: ["GBG", "BTB", "GBG"]
      ingredients: {G: "material:GLOWSTONE_DUST", B: "material:BLAZE_POWDER", T: "material:TNT"}
    texture: {base: "#D8C84A", accent: "#3A3A10", pattern: dots}

  launch_tnt:
    name: "&bLaunch TNT"
    lore:
      - "&7Knocks everything in range up and away."
      - "&7Fall damage is cancelled for the launched."
    material: TNT
    fuse-ticks: 40
    radius: 8
    mechanic: launch
    effects: []
    settings:
      up: 1.4
      radial: 1.6
      damage: 0
    recipe:
      type: shaped
      pattern: ["SPS", "PTP", "SPS"]
      ingredients: {S: "material:SLIME_BLOCK", P: "material:PISTON", T: "material:TNT"}
    texture: {base: "#3AAA6A", accent: "#D8FFE8", pattern: stripes}

  teleport_tnt:
    name: "&5Teleport TNT"
    lore:
      - "&7Moves everything in range. Place it, then"
      - "&7/mtnt target at a block to pick a destination."
    material: TNT
    fuse-ticks: 40
    radius: 10
    mechanic: teleport
    effects: []
    settings:
      random-offset: 12
    recipe:
      type: shaped
      pattern: ["EPE", "PTP", "EPE"]
      ingredients: {E: "material:ENDER_PEARL", P: "material:CHORUS_FRUIT", T: "material:TNT"}
    texture: {base: "#1A0A2E", accent: "#8A4DFF", pattern: glyph}

  gravity_flip_tnt:
    name: "&3Gravity-Flip TNT"
    lore:
      - "&7Lifts everything in range into the air for a"
      - "&7while, then lets it fall. Approximate by design."
    material: TNT
    fuse-ticks: 40
    radius: 9
    mechanic: gravity_flip
    effects: []
    settings:
      duration-ticks: 100
      lift: 0.9
    recipe:
      type: shaped
      pattern: ["FGF", "GTG", "FGF"]
      ingredients: {F: "material:FEATHER", G: "item:gravity_core", T: "material:TNT"}
    texture: {base: "#1E4A6A", accent: "#E8F8FF", pattern: rings}

  # ----------------------------------------------------------------- Timing / logic

  conditional_tnt:
    name: "&6Conditional TNT"
    lore:
      - "&7A logic gate. Only detonates when its"
      - "&7conditions hold; otherwise it fizzles."
      - "&8Conditions are set in tnts.yml."
    material: TNT
    fuse-ticks: 80
    radius: 6
    mechanic: conditional
    effects: []
    settings:
      require-block: REDSTONE_BLOCK
      block-radius: 3
      require-player-within: 0
      require-powered: false
      time-min: -1
      time-max: -1
      mode: all
      damage: 14
    recipe:
      type: shaped
      pattern: ["CRC", "RTR", "CRC"]
      ingredients: {C: "material:COMPARATOR", R: "material:REDSTONE", T: "material:TNT"}
    texture: {base: "#3A3A3A", accent: "#FF3A3A", pattern: circuit}

  proximity_tnt:
    name: "&4Proximity TNT"
    lore:
      - "&7Arms after a moment. The first player who"
      - "&7comes near sets off a countdown. A trap."
    material: TNT
    fuse-ticks: 80
    radius: 6
    mechanic: proximity_tnt
    effects: []
    settings:
      arm-ticks: 60
      trigger-radius: 3
      damage: 14
    recipe:
      type: shaped
      pattern: ["QPQ", "PTP", "QPQ"]
      ingredients: {Q: "item:quantum_detonator", P: "material:STONE_PRESSURE_PLATE", T: "material:TNT"}
    texture: {base: "#4A0A0A", accent: "#FFD000", pattern: glyph}

  pulse_tnt:
    name: "&cPulse TNT"
    lore:
      - "&7Sends a redstone pulse through a shell around"
      - "&7it, powering doors, lamps and pistons. May explode."
    material: TNT
    fuse-ticks: 40
    radius: 4
    mechanic: pulse_tnt
    effects: []
    settings:
      explode: true
      pulse-radius: 6
      pulse-ticks: 40
      pulse-material: REDSTONE_BLOCK
      damage: 6
    recipe:
      type: shaped
      pattern: ["CRC", "CTC", "CRC"]
      ingredients: {C: "item:pulse_capacitor", R: "material:REDSTONE_BLOCK", T: "material:TNT"}
    texture: {base: "#8A1A1A", accent: "#FF6060", pattern: circuit}

  mirror_tnt:
    name: "&bMirror TNT"
    lore:
      - "&7Carves the same blast again, reflected across"
      - "&7a plane. For symmetry builds and puzzles."
    material: TNT
    fuse-ticks: 60
    radius: 5
    mechanic: mirror_tnt
    effects: []
    settings:
      axis: x
      plane-offset: 24
      damage: 10
    recipe:
      type: shaped
      pattern: ["GIG", "ITI", "GIG"]
      ingredients: {G: "material:GLASS", I: "material:IRON_INGOT", T: "material:TNT"}
    texture: {base: "#C8E8F0", accent: "#3A6A7A", pattern: checker}

  # ----------------------------------------------------------------- Visual / audio

  shockwave_tnt:
    name: "&fShockwave TNT"
    lore:
      - "&7A ring of flame expands before anything breaks."
      - "&8Only players nearby see the ring."
    material: TNT
    fuse-ticks: 60
    radius: 6
    mechanic: standard
    effects: [shockwave_ring]
    settings:
      ring-ticks: 12
      damage: 12
    recipe:
      type: shaped
      pattern: ["FFF", "FTF", "FFF"]
      ingredients: {F: "material:FIREWORK_ROCKET", T: "material:TNT"}
    texture: {base: "#2A2A3A", accent: "#FFD8A0", pattern: rings}

  debris_tnt:
    name: "&7Debris TNT"
    lore:
      - "&7Destroyed blocks fly out as falling blocks."
      - "&7They land, and can be collected."
    material: TNT
    fuse-ticks: 60
    radius: 6
    mechanic: standard
    effects: [debris]
    settings:
      damage: 12
    recipe:
      type: shaped
      pattern: ["CCC", "CTC", "CCC"]
      ingredients: {C: "material:COBBLESTONE", T: "material:TNT"}
    texture: {base: "#5A5A5A", accent: "#9A8A6A", pattern: dots}

  echo_tnt:
    name: "&5Echo TNT"
    lore:
      - "&7The blast repeats, visually and audibly,"
      - "&7a few times after. A decoy with no damage."
    material: TNT
    fuse-ticks: 60
    radius: 5
    mechanic: standard
    effects: [echo]
    settings:
      echo-count: 3
      echo-interval: 8
      echo-jitter: 4
      damage: 10
    recipe:
      type: shaped
      pattern: ["NNN", "NTN", "NNN"]
      ingredients: {N: "material:NOTE_BLOCK", T: "material:TNT"}
    texture: {base: "#3A1A5A", accent: "#D0A0FF", pattern: rings}

  silent_tnt:
    name: "&8Silent TNT"
    lore:
      - "&7No hiss, no sound, no particles, until it is"
      - "&7too late. The stealth variant."
    material: TNT
    fuse-ticks: 80
    radius: 5
    mechanic: standard
    effects: [silent]
    settings:
      damage: 12
    recipe:
      type: shaped
      pattern: ["WWW", "WTW", "WWW"]
      ingredients: {W: "material:WHITE_WOOL", T: "material:TNT"}
    texture: {base: "#262626", accent: "#4A4A4A", pattern: checker}

  # ----------------------------------------------------------------- Utility / economy

  harvest_tnt:
    name: "&aHarvest TNT"
    lore:
      - "&7A mining charge. Blocks break, but their"
      - "&7drops go to whoever lit it."
    material: TNT
    fuse-ticks: 60
    radius: 6
    mechanic: harvest
    effects: []
    settings:
      max-items: 2000
      damage: 0
    recipe:
      type: shaped
      pattern: ["HHH", "HTH", "HHH"]
      ingredients: {H: "material:HOPPER", T: "material:TNT"}
    texture: {base: "#2A6A3A", accent: "#E8D050", pattern: stripes}

  sorting_tnt:
    name: "&9Sorting TNT"
    lore:
      - "&7Pulls chosen ores out of the blast and into the"
      - "&7nearest chest. An automatic collector."
    material: TNT
    fuse-ticks: 60
    radius: 6
    mechanic: sorting
    effects: []
    settings:
      sort-materials: [IRON_ORE, DEEPSLATE_IRON_ORE, GOLD_ORE, DEEPSLATE_GOLD_ORE, DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, EMERALD_ORE, COAL_ORE, REDSTONE_ORE, LAPIS_ORE]
      container-radius: 12
      damage: 6
    recipe:
      type: shaped
      pattern: ["CMC", "MTM", "CMC"]
      ingredients: {C: "material:CHEST", M: "item:sorting_magnet", T: "material:TNT"}
    texture: {base: "#34507A", accent: "#A0C8FF", pattern: checker}

  marker_tnt:
    name: "&bMarker TNT"
    lore:
      - "&7Does not explode. Outlines its region for"
      - "&7everyone nearby. Lighting it scans the region."
    material: TNT
    fuse-ticks: 20
    radius: 10
    mechanic: marker
    effects: []
    settings: {}
    recipe:
      type: shaped
      pattern: ["PLP", "LTL", "PLP"]
      ingredients: {P: "material:PAPER", L: "material:LAPIS_LAZULI", T: "material:TNT"}
    texture: {base: "#1E3A5A", accent: "#55FFFF", pattern: cross}

  anchor_tnt:
    name: "&bAnchor TNT"
    lore:
      - "&7Creates an anti-TNT field. While it stands,"
      - "&7explosions cannot reach inside its radius."
      - "&8Lighting it does nothing."
    material: TNT
    fuse-ticks: 20
    radius: 12
    mechanic: anchor
    effects: []
    settings: {}
    recipe:
      type: shaped
      pattern: ["ACA", "CTC", "ACA"]
      ingredients: {A: "item:anchor_crystal", C: "material:CRYING_OBSIDIAN", T: "material:TNT"}
    texture: {base: "#2A1A50", accent: "#9AF0FF", pattern: cross}

  # ----------------------------------------------------------------- Military

  biological_tnt:
    name: "&2Biological TNT"
    lore:
      - "&7A small burst, then a cloud of blight. Creatures"
      - "&7sicken, grass turns to path, leaves and plants die."
      - "&cHazardous. Stay out of the cloud."
    material: TNT
    fuse-ticks: 40
    radius: 10
    mechanic: biological
    effects: []
    settings:
      burst-radius: 3.5
      duration-seconds: 30
      tick-interval: 20
      samples: 180
      player-damage: 1.0
      mob-damage: 2.0
    recipe:
      type: shaped
      pattern: ["BCB", "CTC", "BCB"]
      ingredients: {B: "item:biohazard_culture", C: "material:COMPOSTER", T: "material:TNT"}
    texture: {base: "#2A5A1A", accent: "#9AFF40", pattern: bio}

  napalm_tnt:
    name: "&6Napalm TNT"
    lore:
      - "&7Throw it. It bursts where it lands, spreading"
      - "&7fire along the way it fell. Placed, it burns in a circle."
    material: TNT
    fuse-ticks: 40
    radius: 5
    mechanic: napalm
    effects: []
    settings:
      stretch: 1.6
      damage: 4
    recipe:
      type: shaped
      pattern: ["NGN", "GTG", "NGN"]
      ingredients: {N: "item:napalm_gel", G: "material:GUNPOWDER", T: "material:TNT"}
    texture: {base: "#8A2A0A", accent: "#FFB020", pattern: flame}

  # ----------------------------------------------------------------- Nuclear family
  #  Yields are approximate public figures. Radii, fuses and crater sizes are scaled for gameplay.

  nuke_davy_crockett:
    name: "&aDavy Crockett Warhead"
    lore:
      - "&7W54 family, USA. About 20 tons of yield."
      - "&7Tier 1 of 10. Small, but not safe."
    material: TNT
    fuse-ticks: 100
    radius: 14
    mechanic: nuclear
    effects: []
    settings: &nuke-common
      fire-far-seconds: 20
      fire-near-seconds: 5
      beam-seconds: 30
      damage: 40
      shape: saucer
      crater-radius: 30
      crater-depth: 5
      flatten-radius: 50
    recipe:
      type: shaped
      pattern: ["ENE", "NCN", "ENE"]
      ingredients: {E: "item:enriched_uranium", N: "item:neutron_initiator", C: "item:nuclear_casing"}
    texture: {base: "#3A4A2A", accent: "#E8FF60", pattern: nuclear}

  nuke_little_boy:
    name: "&aLittle Boy"
    lore:
      - "&7Hiroshima, 1945. About 15 kilotons."
      - "&7Tier 2 of 10."
    material: TNT
    fuse-ticks: 200
    radius: 28
    mechanic: nuclear
    effects: []
    settings:
      <<: *nuke-common
      crater-radius: 60
      crater-depth: 8
      flatten-radius: 100
    recipe:
      type: shaped
      pattern: ["EEE", "ECE", "EEE"]
      ingredients: {E: "item:enriched_uranium", C: "item:nuclear_casing"}
    texture: {base: "#3A4A2A", accent: "#E8FF60", pattern: nuclear}

  nuke_fat_man:
    name: "&eFat Man"
    lore:
      - "&7Nagasaki, 1945. About 21 kilotons."
      - "&7Tier 3 of 10. Plutonium implosion."
    material: TNT
    fuse-ticks: 220
    radius: 32
    mechanic: nuclear
    effects: []
    settings:
      <<: *nuke-common
      crater-radius: 65
      crater-depth: 8
      flatten-radius: 110
    recipe:
      type: shaped
      pattern: ["PEP", "ECE", "PEP"]
      ingredients: {P: "item:plutonium_pit", E: "item:enriched_uranium", C: "item:nuclear_casing"}
    texture: {base: "#4A4A2A", accent: "#FFE860", pattern: nuclear}

  nuke_joe_1:
    name: "&eJoe-1 (RDS-1)"
    lore:
      - "&7First Lightning, USSR, 1949. About 22 kilotons."
      - "&7Tier 4 of 10."
    material: TNT
    fuse-ticks: 240
    radius: 34
    mechanic: nuclear
    effects: []
    settings:
      <<: *nuke-common
      crater-radius: 70
      crater-depth: 8
      flatten-radius: 115
